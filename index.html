<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embaralho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* VOICE party word game: bright, bouncy, sticker-like
   IDEA a box of word dice on a glowing arcade mat; every screen is a sticker sheet
   PICTURE the board itself, large, with the swipe trail, hint glow and reactions
   COLOUR animated gradient per mode (cyan-blue classic, teal daily, violet-pink survival); cream tiles with ink outline; sun yellow selection; coral trail
   TYPE Fredoka for tiles, numbers and titles + Nunito for text
   LAYOUT laptop: hud on top, board centre, words column right; phone: hud, board, tools, words below */
:root{--ink:#1b1238;--tile:#fff7e8;--tileS:#d9c39c;--sel:#ffd23f;--selS:#d9a400;--coral:#ff4f7b;--coralS:#c6305a;--mint:#2ee6a6;--mintS:#14a979;--panel:rgba(255,255,255,.94);--panelInk:#1b1238;--muted:#5c5478;--soft:#efeaff;--line:#d9d2f2;--glass:rgba(20,10,60,.28);--fd:Fredoka,ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--fb:Nunito,ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--g1:#18c5ea;--g2:#3f66ff;--g3:#7b4dff}
:root[data-theme=dark],:root:not([data-theme=light]){color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--panel:rgba(28,18,70,.95);--panelInk:#f3efff;--muted:#b6acd8;--soft:#2c2160;--line:#3d3180}}
:root[data-theme=dark]{--panel:rgba(28,18,70,.95);--panelInk:#f3efff;--muted:#b6acd8;--soft:#2c2160;--line:#3d3180}
body.m-daily{--g1:#13d3a8;--g2:#1590e8;--g3:#3a5bff}
body.m-surv{--g1:#9b4dff;--g2:#e24fd0;--g3:#4a36d8}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:rgba(123,77,255,.55) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(123,77,255,.55);border-radius:99px}::-webkit-scrollbar-track{background:transparent}
html,body{height:100%}
body{margin:0;color:#fff;font:16px/1.5 var(--fb);overflow-x:clip;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:var(--g2)}
.bg{position:fixed;inset:-20%;z-index:-2;background:linear-gradient(120deg,var(--g1),var(--g2) 45%,var(--g3));background-size:200% 200%;animation:bgmove 18s ease-in-out infinite alternate;transition:background .6s}
.bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 22px,transparent 22px 44px)}
@keyframes bgmove{to{background-position:100% 100%}}
button{font:800 16px/1 var(--fb);cursor:pointer;border:3px solid var(--ink);border-radius:16px;min-height:46px;padding:0 16px;color:var(--ink);background:var(--tile);box-shadow:0 4px 0 var(--ink);touch-action:manipulation;transition:transform .06s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--sel);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
.b-pri{background:var(--mint)}
.b-cor{background:var(--coral);color:#fff}
.b-sun{background:var(--sel)}
.b-ghost{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:none}
.b-ghost:active{box-shadow:none}
.ico{width:46px;padding:0;display:inline-grid;place-items:center}
.app{max-width:1180px;margin:0 auto;min-height:100%;padding:10px max(14px,3vw) 24px;display:flex;flex-direction:column;gap:8px}
/* ---------- HUD ---------- */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.me{display:flex;align-items:center;gap:8px}
.me .av{width:54px;height:54px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.me .nm{font:700 17px/1.1 var(--fd)}
.me .wc{font:800 13px var(--fb);opacity:.9}
.hud-r{display:flex;justify-content:flex-end;gap:8px}
.pill{position:relative;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 12px;border-radius:99px;background:var(--ink);color:#fff;font:700 22px var(--fd);font-variant-numeric:tabular-nums}
.pill svg.ring{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);overflow:visible;pointer-events:none}
.pill svg.ring rect{fill:none;stroke:#fff;stroke-width:4;transition:stroke-dashoffset .95s linear}
.pill .hg{width:22px;height:26px;animation:rock 1.6s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.pill.low{background:var(--coral)}
.pill.low .t{animation:beat 1s infinite}
@keyframes beat{0%{transform:scale(1.35)}35%{transform:scale(1)}}
.batt{display:flex;align-items:center;gap:10px}
.batt .cell{position:relative;width:150px;height:46px;border:4px solid #fff;border-radius:14px;background:rgba(0,0,0,.35);overflow:hidden}
.batt .cell::after{content:"";position:absolute;right:-12px;top:12px;width:8px;height:14px;border-radius:0 4px 4px 0;background:#fff}
.batt .fill{position:absolute;inset:3px auto 3px 3px;border-radius:8px;transition:width .4s,background .4s}
.batt .gain{position:absolute;left:50%;top:-6px;font:700 18px var(--fd);color:#fff;text-shadow:0 2px 0 var(--ink);animation:up 1s forwards;pointer-events:none}
.danger-stripes{position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(135deg,rgba(255,79,123,.55) 0 18px,transparent 18px 36px);-webkit-mask:radial-gradient(ellipse at center,transparent 58%,#000 82%);mask:radial-gradient(ellipse at center,transparent 58%,#000 82%);animation:dpulse 1s infinite}
body.m-classic .danger-stripes,body.m-daily .danger-stripes{background:repeating-linear-gradient(135deg,rgba(255,210,63,.6) 0 18px,transparent 18px 36px)}
@keyframes dpulse{50%{opacity:.45}}
/* ---------- palavra ---------- */
.wordzone{height:84px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.fb{font:900 13px var(--fb);padding:4px 12px;border-radius:99px;color:var(--ink);animation:pop .3s}
.fb.ok{background:var(--mint)}.fb.dup{background:var(--sel)}.fb.bad{background:var(--coral);color:#fff}.fb.short{background:#ff9f43}
.wchip{min-width:60px;height:46px;padding:0 18px;border-radius:99px;background:var(--ink);display:flex;align-items:center;justify-content:center;font:700 26px var(--fd);letter-spacing:.05em;white-space:nowrap;text-transform:uppercase}
.wchip:empty{visibility:hidden}
.wchip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* ---------- tabuleiro ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.tray{position:relative;width:min(100%,560px,calc(100svh - 270px));min-width:280px;aspect-ratio:1;padding:3%;border-radius:30px;background:var(--glass);box-shadow:inset 0 4px 0 rgba(0,0,0,.15),0 0 0 3px rgba(255,255,255,.25);touch-action:none}
.tray.veil .grid{filter:blur(14px);opacity:.5}
.grid{position:relative;width:100%;height:100%;display:grid;gap:2.6%}
.grid.spin{transition:transform .26s ease-in;transform:rotate(90deg)}
.tile{position:relative;display:grid;place-items:center;border-radius:20%;background:linear-gradient(#fffdf7,var(--tile));color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font:700 var(--fs,48px)/1 var(--fd);text-transform:uppercase;transition:background .12s,transform .08s}
.tile.m{font-size:calc(var(--fs,48px)*.8);letter-spacing:-.05em}.tile.m3{font-size:calc(var(--fs,48px)*.6);letter-spacing:-.06em}
.tile.off{background:rgba(255,255,255,.14);border:2px dashed rgba(255,255,255,.35);box-shadow:none;color:transparent}
.tile.on{background:linear-gradient(#ffe680,var(--sel));transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tile.hint{background:linear-gradient(#bff8ff,#6ee7ff);animation:hintin .35s}

.tile.hint.on{background:linear-gradient(#ffe680,var(--sel));transform:translateY(3px);box-shadow:0 2px 0 var(--ink),inset 0 0 0 4px #6ee7ff}
@keyframes hintin{0%{transform:scale(.8)}60%{transform:scale(1.1)}}
.tile.ok{animation:okfl .55s}
@keyframes okfl{40%{background:var(--mint);transform:translateY(-6px) scale(1.06)}}
.tile.deal{animation:deal .5s cubic-bezier(.2,1.25,.4,1) backwards}
@keyframes deal{0%{transform:perspective(500px) rotateY(180deg) scale(.5);opacity:0;color:transparent}45%{color:transparent}55%{opacity:1}100%{transform:none;opacity:1}}
.tile.new{animation:newc .6s backwards}
@keyframes newc{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}}
.trail{position:absolute;inset:3%;width:94%;height:94%;pointer-events:none;overflow:visible}
.selg line,.hintg line{stroke:#1b1238;stroke-linecap:round}
.selg line.o,.hintg line.o{stroke:#fff}
.selg circle{fill:#1b1238}
.hintg line{stroke:var(--ink);stroke-opacity:.75;stroke-linecap:round}
.hintg circle{fill:var(--ink)}
.hintg text{fill:#fff;font:900 12px var(--fb);text-anchor:middle;dominant-baseline:central}
.fly{position:fixed;z-index:6;pointer-events:none;display:grid;place-items:center;border-radius:18%;background:var(--mint);border:3px solid var(--ink);color:var(--ink);font:700 28px var(--fd);text-transform:uppercase;animation:flyup 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes flyup{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.5);opacity:0}}
.conf{position:fixed;z-index:6;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.pop{position:absolute;pointer-events:none;font:700 28px var(--fd);color:#fff;text-shadow:0 3px 0 var(--ink);animation:up .9s forwards;transform:translate(-50%,-50%);z-index:3}
@keyframes up{to{transform:translate(-50%,-170%);opacity:0}}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:50px}
.hintBtn{background:#ff7ad9;animation:pop .35s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}}
/* ---------- lateral ---------- */
.side{background:var(--panel);color:var(--panelInk);border:3px solid var(--ink);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100svh - 120px);min-height:280px;box-shadow:0 6px 0 var(--ink)}
.side h2{margin:0;font:700 18px var(--fd);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.side h2 small{font:800 13px var(--fb);color:var(--muted)}
.lens{display:grid;gap:6px}
.lr{display:grid;grid-template-columns:5em minmax(0,1fr) auto;gap:8px;align-items:center;font:800 13px var(--fb)}
.lr .b{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.lr .b i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:99px;transition:width .3s}
.lr span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.list{overflow:auto;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;flex:1}
.chip{font:600 15px var(--fd);text-transform:uppercase;padding:3px 10px;border-radius:10px;background:var(--soft);color:var(--panelInk);white-space:nowrap;border:2px solid transparent}
.chip i{font-style:normal;margin-left:6px;font-size:13px;opacity:.75}
.chip.new{animation:pop .4s}
.chip[data-w]{cursor:pointer}
.chip.miss{background:transparent;border:2px dashed var(--line)}
.chip[data-w]:hover,.chip[data-w]:focus-visible{background:var(--sel);color:var(--ink);outline:none}
.L3{--lc:#ffffff}.L4{--lc:#7ff0ff}.L5{--lc:#b8ff6a}.L6{--lc:#ff9ad5}.L7{--lc:#ffd23f}.L8{--lc:#ff8a4c}
.wc-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 4px 0 12px;border-radius:99px;background:var(--ink);color:var(--lc,#fff);font:700 15px var(--fd);text-transform:uppercase;white-space:nowrap;animation:pop .3s backwards}
.wc-chip b{display:grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:99px;background:var(--lc,#fff);color:var(--ink);font:700 14px var(--fd)}
.empty{color:var(--muted);font-size:15px}
/* ---------- telas ---------- */
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:14px;z-index:5;overflow:auto;background:rgba(15,8,45,.35);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.card{width:min(560px,100%);background:var(--panel);color:var(--panelInk);border:3px solid var(--ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 var(--ink);margin:auto;animation:cardin .35s}
@keyframes cardin{from{transform:translateY(24px) scale(.96);opacity:0}}
.card h1{margin:0;font:700 30px/1.08 var(--fd);letter-spacing:-.01em;text-wrap:balance}
.card h3{margin:0;font:700 18px var(--fd)}
.card p{margin:0}
.note{font-size:15px;color:var(--muted)}
.topbar{display:flex;align-items:center;gap:10px}
.topbar .t{font:700 22px var(--fd);flex:1}
.back{background:var(--sel);width:52px;padding:0}
.logo{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.logo span{display:inline-grid;place-items:center;width:38px;height:42px;border-radius:10px;background:var(--tile);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:700 24px/1 var(--fd);animation:wave 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
.logo span:nth-child(3n){background:var(--sel)}
@keyframes wave{0%,60%,100%{transform:none}30%{transform:translateY(-7px) rotate(-4deg)}}
.prof{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--soft)}
.prof .av{width:64px;height:64px;flex:none}
.prof .nm{font:700 20px var(--fd)}
.prof button{margin-left:auto}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:12px;text-align:left;min-height:78px;padding:8px 14px;border-radius:20px}
.mode svg{width:60px;height:60px;transition:transform .3s}
.mode:hover svg,.mode:focus-visible svg{transform:rotate(-8deg) scale(1.08)}
.mode b{display:block;font:700 20px var(--fd)}
.mode small{display:block;font:700 13px var(--fb);opacity:.8;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>button{flex:1 1 120px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:0 8px;background:var(--soft);color:var(--panelInk);border-color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--ink)}
#segLang{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
#diffs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label{font-weight:900;font-size:14px}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sizes button{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--soft);color:var(--panelInk)}
.sizes button b{font:700 24px var(--fd)}
.sizes button small{font:800 12px var(--fb);opacity:.8}
.sizes button[aria-pressed=true]{background:var(--sel);color:var(--ink)}
.lock{font-size:12px}
input[type=range]{width:100%;accent-color:var(--coral);height:28px}
.ticks{display:flex;justify-content:space-between;font:800 12px var(--fb);color:var(--muted)}
input[type=text]{width:100%;font:700 20px var(--fd);padding:10px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--soft);color:var(--panelInk);-webkit-user-select:text;user-select:text}
.avs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-height:300px;overflow:auto;padding:4px}
.avs button{aspect-ratio:1;min-height:0;padding:4px;border-radius:16px;background:var(--soft)}
.avs button[aria-pressed=true]{background:var(--sel)}
.avs svg{width:100%;height:100%}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.how div{background:var(--soft);border-radius:16px;padding:10px;text-align:center;font:800 13px/1.3 var(--fb);animation:cardin .4s backwards}
.how div:nth-child(2){animation-delay:.35s}.how div:nth-child(3){animation-delay:.7s}
.how svg{width:56px;height:56px;display:block;margin:0 auto 6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border-radius:16px;padding:10px 12px}
.stat small{display:block;font:800 12px var(--fb);color:var(--muted)}
.stat b{font:700 24px var(--fd)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1 0 44px;min-width:44px;padding:0 6px;font-size:13px;min-height:40px;background:var(--soft);color:var(--panelInk)}
.tabs button[aria-pressed=true]{background:var(--sel);color:var(--ink)}
.achs{display:grid;gap:8px;max-height:420px;overflow:auto;padding:2px}
.ach{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;background:var(--soft);border-radius:16px;padding:10px}
.ach .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:var(--panel);border:2px solid var(--ink)}
.ach h4{margin:0;font:700 16px var(--fd);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ach h4 em{font-style:normal;font:900 11px var(--fb);background:var(--ink);color:#fff;border-radius:99px;padding:2px 8px}
.ach p{margin:0;font-size:13px;color:var(--muted)}
.bar{position:relative;height:16px;border-radius:99px;background:#fff;border:2px solid var(--ink);overflow:hidden;margin-top:4px}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--g1),var(--mint));transition:width 1s ease}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font:900 11px var(--fb);color:#1b1238}
/* ---------- contagem / transição / toast ---------- */
.cd{position:fixed;inset:0;display:grid;place-items:center;z-index:8;pointer-events:none}
.cd b{font:700 min(40vw,220px)/1 var(--fd);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke;text-shadow:0 10px 0 var(--ink);animation:cdpop .8s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes cdpop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.15);opacity:1}60%{transform:scale(1)}100%{transform:scale(1.4);opacity:0}}
.wipe{position:fixed;inset:0;z-index:9;pointer-events:none;display:grid;overflow:hidden}
.wipe i{border-radius:50%;background:var(--ink);transform:scale(0);animation:dot .7s ease-in-out forwards}
@keyframes dot{45%,55%{transform:scale(1.5)}100%{transform:scale(0)}}
.toast{position:fixed;right:16px;top:16px;z-index:10;background:var(--ink);color:#fff;padding:12px 18px 16px;border-radius:18px;font-weight:800;min-width:240px;max-width:92vw;text-align:center;overflow:hidden;animation:cardin .3s;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.toast i{position:absolute;left:0;bottom:0;height:5px;background:var(--sel);animation:tbar linear forwards}
@keyframes tbar{from{width:0}to{width:100%}}
/* ---------- resultado ---------- */
.res{position:fixed;inset:0;z-index:6;overflow:hidden;background:linear-gradient(120deg,var(--g1),var(--g2) 45%,var(--g3))}
.rs{height:100%;max-width:1500px;margin:0 auto;padding:clamp(10px,2vh,22px) clamp(14px,2.5vw,36px);display:grid;grid-template-columns:clamp(200px,20vw,290px) minmax(0,1fr) clamp(250px,24vw,360px);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"board head skip" "av mid br" "act act act";gap:clamp(8px,1.6vh,18px) 20px}
.r-board{grid-area:board}.r-head{grid-area:head;align-self:center;display:flex;justify-content:center}.r-skip{grid-area:skip;justify-self:end;align-self:start}
.r-mid{grid-area:mid;min-height:0;display:flex;align-items:center;justify-content:center}.r-av{grid-area:av;align-self:end}.r-br{grid-area:br;align-self:end;min-width:0}.r-act{grid-area:act;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.r-act button{flex:0 1 220px}
.minib{display:grid;gap:4px;width:100%;max-width:clamp(150px,18vh,210px);aspect-ratio:1;padding:6px;border-radius:16px;background:var(--glass)}
.minib div{display:grid;place-items:center;border-radius:7px;background:var(--tile);border:2px solid var(--ink);color:var(--ink);font:700 clamp(11px,1.8vh,17px) var(--fd);text-transform:uppercase;transition:background .3s,opacity .3s}
.minib div.off{background:transparent;border:1px dashed rgba(255,255,255,.3);color:transparent}
.minib div.dim{background:rgba(255,255,255,.18);border-color:transparent;color:transparent}
.minib div.on{background:#6ee7ff;box-shadow:0 0 12px #6ee7ff}

/* ---------- dicionário ---------- */
async function loadDict(lang){
  if(dicts[lang])return dicts[lang];
  const j=await (await fetch('dict-'+lang+'.json')).json();
  const bin=Uint8Array.from(atob(j.d),c=>c.charCodeAt(0));
  const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const lines=txt.split('\n'),words=new Array(lines.length),lv=new Uint8Array(lines.length),disp=new Map();let prev='';
  for(let i=0;i<lines.length;i++){const l=lines[i];const k=l.charCodeAt(0)-48;let s=l.slice(1),v=1;const eq=s.indexOf('=');let dv=null;if(eq>=0){dv=s.slice(eq+1);s=s.slice(0,eq)}
    const last=s[s.length-1];if(last==='!'){v=0;s=s.slice(0,-1)}else if(last==='*'){v=2;s=s.slice(0,-1)}else if(last==='^'){v=3;s=s.slice(0,-1)}
    lv[i]=v;prev=prev.slice(0,k)+s;words[i]=prev;if(dv)disp.set(prev,dv)}
  return dicts[lang]={words,lv,disp,w:j.w,v:j.v,min:j.min||[40,100]}}
function lb(a,s){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<s)lo=m+1;else hi=m}return lo}
function look(d,s){const i=lb(d.words,s);const w=d.words[i];return{word:w===s,rare:w===s&&d.lv[i]===0,lvl:w===s?d.lv[i]:-1,prefix:w!==undefined&&w.startsWith(s)}}
const show=(lang,w)=>{const d=dicts[lang];return ((d&&d.disp.get(w))||w).toLocaleUpperCase(lang==='de'?'de-DE':lang)};
function normKey(lang,k){k=k.toLowerCase();if(lang==='de')k=k.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  if(lang==='es'&&k==='ñ')return k;k=k.replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'');return/^[a-z]+$/.test(k)?k:''}

/* ---------- tabuleiro ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const EN4='aaeegn abbjoo achops affkps aoottw cimotu deilrx delrvy disttu eeghnw eeinsu ehrtvw eiosst elrtty himnqu hlnnrz'.split(' ');
const EN5='aaafrs aaeeee aafirs adennn aeeeem aeegmu aegmnn afirsy bjkqxz ccenst ceiilt ceilpt ceipst ddhnot dhhlor dhlnor dhlnor eiiitt emottt ensssu fiprsy gorrvw iprrry nootuw ooottu'.split(' ');
const isV=t=>/^[aeiou]$/.test(t);
function pickTile(d,r){const tiles=d.w,tot=tiles.reduce((a,x)=>a+x[1],0);let x=r()*tot;for(const[l,w]of tiles){x-=w;if(x<=0)return l}return tiles[0][0]}
function genW(d,N,r){const n=N*N,frac=(d.v[1]+d.v[0])/32,lo=Math.round(n*frac)-Math.ceil(n/16),hi=Math.round(n*frac)+Math.ceil(n/16);
  for(;;){const g=[];let sp=0;const cnt={};
    while(g.length<n){const t=pickTile(d,r);if(t.length>1&&sp>=Math.ceil(n/8))continue;if((cnt[t]||0)>=Math.ceil(n/5))continue;cnt[t]=(cnt[t]||0)+1;if(t.length>1)sp++;g.push(t)}
    const v=g.filter(isV).length;if(v>=lo&&v<=hi)return g}}
function genEN(N,r){const dice=(N===4?EN4:EN5).slice();for(let i=dice.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[dice[i],dice[j]]=[dice[j],dice[i]]}return dice.map(d=>{const f=d[Math.floor(r()*6)];return f==='q'?'qu':f})}
const NB={};function nbrs(i,N){const k=N+'_'+i;if(NB[k])return NB[k];const x=i%N,y=(i/N)|0,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<N&&b<N)o.push(b*N+a)}return NB[k]=o}
function solve(g,N,d){
  const out=new Map(),used=new Uint8Array(N*N),path=[];
  const go=(i,s)=>{s+=g[i];const q=look(d,s);if(!q.prefix)return;used[i]=1;path.push(i);
    if(q.word&&s.length>=3&&!out.has(s))out.set(s,{path:path.slice(),rare:q.rare,lvl:q.lvl});
    for(const n of nbrs(i,N))if(!used[n]&&g[n])go(n,s);used[i]=0;path.pop()};
  for(let i=0;i<N*N;i++)if(g[i])go(i,'');return out}
function findPath(g,N,w){
  const used=new Uint8Array(N*N),path=[];
  const go=(i,k)=>{const t=g[i];if(!t||!w.startsWith(t,k))return false;used[i]=1;path.push(i);k+=t.length;if(k===w.length)return true;
    for(const n of nbrs(i,N))if(!used[n]&&go(n,k))return true;used[i]=0;path.pop();return false};
  for(let i=0;i<N*N;i++)if(go(i,0))return path;return null}
const keyCount=sol=>{let c=0;for(const v of sol.values())if(v.lvl>=2)c++;return c};
function makeBoard(lang,N,seed){
  const d=dicts[lang],r=rng(seed),min=N===4?d.min[0]:N===5?d.min[1]:Math.round(d.min[1]*1.7);let best=null;
  for(let t=0;t<40;t++){const g=(lang==='en'&&N<6)?genEN(N,r):genW(d,N,r);const sol=solve(g,N,d);let c=0;for(const v of sol.values())if(!v.rare)c++;
    if(!best||c>best.c)best={g,sol,c};if(c>=min)break}
  return best}
/* sobrevivência: moldura 6x6, começa 4x4 no centro e cresce: cima, direita, baixo, esquerda */
const SURV_STEPS=[[1,2,3,4].map(c=>c),[5,11,17,23,29],[31,32,33,34,35],[0,6,12,18,24,30]];
function survStart(lang,seed){const d=dicts[lang],r=rng(seed);let best=null;
  for(let t=0;t<30;t++){const g4=genW(d,4,r);const g=new Array(36).fill(null);g4.forEach((t,i)=>{g[(1+((i/4)|0))*6+1+(i%4)]=t});const sol=solve(g,6,d);const c=keyCount(sol);if(!best||c>best.c)best={g,sol,c};if(c>=d.min[0]*.8)break}
  return best}
function survGrow(){const step=SURV_STEPS[G.step];if(!step)return;const d=dicts[G.lang],r=rng(hash(G.seed+'g'+G.step));let best=null;
  for(let t=0;t<12;t++){const g=G.g.slice();let vow=0;step.forEach(i=>{const x=pickTile(d,r);g[i]=x;if(isV(x))vow++});if(!vow)continue;const sol=solve(g,6,d);const c=keyCount(sol);if(!best||c>best.c)best={g,sol,c}}
  if(!best)return;G.g=best.g;G.sol=best.sol;G.step++;render(step);beep(520,.12,'triangle');updSide()}

function longestOf(res,a){const f=new Set(res.found);let longest=null;for(const minL of[2,1]){for(const[w,v]of a.sol){if(v.lvl<minL&&!f.has(w))continue;if(!longest||w.length>longest.length||(w.length===longest.length&&v.lvl>a.sol.get(longest).lvl))longest=w}if(longest)break}return longest}

      if(surv)$('#rTot').textContent=fmt(res.elapsed*k);else{const m=Math.floor(k*n);let run=0;for(let i=0;i<m;i++)run+=pts(words[i].length);$('#rTot').textContent=run;if(m!==lastK&&m>0){lastK=m;beep(480+Math.min(25,m)*22,.035,'triangle',.035)}}
      k<1?requestAnimationFrame(st):r()};requestAnimationFrame(st)});
  if(tok!==resTok)return;$('#rCols').classList.add('fast');

  await rwait(250);$('#plS').textContent=fin;beep(880,.15,'triangle',.06);
  if(res.record){const r=document.createElement('span');r.className='rec';r.textContent=L.record;$('#rPlaque .plaque').appendChild(r);beep(988,.3,'triangle')}

  /* ---- fase 2 ---- */

    $('#rHead').innerHTML=`<div class="balloon"><span class="lbl">${esc(L.longLbl.toUpperCase())}</span><p>${got?L.longGot(esc(show(res.lang,longest))):L.longMissed(esc(show(res.lang,longest)))}</p><div class="tm"></div></div>`;beep(660,.2,'triangle')}
  else $('#rHead').innerHTML='';
  const nx=surv?SURV_T[a.k+1]:TIERS[a.k+1];const msg=nx===undefined?L.maxTier:surv?L.toNextT(fmt(nx-res.elapsed),L.tiers[a.k+1]):L.toNext(Math.max(1,Math.ceil(nx*a.max)-res.score),L.tiers[a.k+1]);
  const achs=(res.ach||[]).sort((x,y)=>(y.to-y.from)/ACH[y.i].lv[0]-(x.to-x.from)/ACH[x.i].lv[0]).slice(0,3);
  const achHTML=achs.map((x,k)=>{const A=ACH[x.i],i=achInfo(A,x.to),fp=Math.min(1,x.from/i.tgt);return `<div class="rcard achmini" style="animation-delay:${300+k*180}ms"><div class="ic">${A.ic}</div><em>Nv.${Math.max(1,i.level+(i.max?0:1))}</em><p>${esc(i.desc)}</p><div class="bar"><i style="width:${fp*100}%" data-to="${i.pct*100}"></i><span>${A.c==='surv'?fmt(Math.min(x.to,i.tgt))+'/'+fmt(i.tgt):Math.min(x.to,i.tgt)+'/'+i.tgt}</span></div></div>`}).join('');

  setTimeout(()=>$$('#rMid .bar i[data-to]').forEach(b=>b.style.width=b.dataset.to+'%'),skipFlag?50:700);
  const hist=res.hist||[];const mx=Math.max(1,...hist.map(h=>h.m)),mw=Math.max(1,...hist.map(h=>h.w));const bars=(arr,m)=>arr.map((v,i)=>`<i class="${i===arr.length-1?'cur':''}" style="height:${Math.max(5,v/m*100)}%;animation-delay:${i*50}ms"></i>`).join('');
  const last=hist[hist.length-1]||{m:surv?res.elapsed:res.score,w:res.found.length};
  $('#rBR').innerHTML=`<div class="charts"><div class="mc"><small>${esc(surv?L.histTime:L.histScore)}</small><div class="bars">${bars(hist.map(h=>h.m),mx)}</div><b>${surv?fmt(last.m):last.m}</b> <small>${esc(L.best)} ${surv?fmt(mx):mx}</small></div><div class="mc"><small>${esc(L.histWords)}</small><div class="bars">${bars(hist.map(h=>h.w),mw)}</div><b>${last.w}</b> <small>${esc(L.best)} ${mw}</small></div>
    <div class="lwbox"><div>${esc(L.longGame)}:<span class="wc-chip L${Math.min(8,(res.longGame||'').length)}">${esc(res.longGame?show(res.lang,res.longGame):'—')}</span></div><div>${esc(L.longEver)}:<span class="wc-chip L${Math.min(8,(res.longEver||'').length)}">${esc(res.longEver?show(res.lang,res.longEver):'—')}</span></div></div></div>`;
  await rwait(900);
  for(const u of res.unl||[]){toast(L.unlocked+' '+u,3500);await rwait(1200)}
  $('#shareBox').textContent=shareText(res,a);
  $('#rActs').innerHTML=`<button class="b-cor" id="bShare">${esc(L.share)}</button><button class="b-pri" id="bAgain">${esc(L.again)}</button><button id="bAll">${esc(L.seeAll)}</button><button class="b-ghost" id="bHome">${esc(L.home)}</button>`;$('#rActs').hidden=false;$('#bSkip').hidden=true;
  $('#bShare').onclick=async()=>{const ok=await copyText(shareText(res,a));toast(ok?L.copied:L.copyFail,2600);if(!ok)openWords()};
  $('#bAgain').onclick=()=>startGame(res.mode==='daily'?'classic':res.mode);$('#bHome').onclick=goHome;$('#bAll').onclick=openWords}
const doSkip=()=>{skipFlag=true;skipRes.splice(0).forEach(f=>f())};$('#bSkip').onclick=doSkip;
$('#vRes').addEventListener('click',e=>{if(!e.target.closest('button,[data-w],a')&&!$('#bSkip').hidden)doSkip()});
function openWords(){const res=R,a=R.a;$('#wTitle').textContent=L.seeAll;$('#shareBox').textContent=shareText(res,a);allWords(res,a);miniPath(R.longest?a.sol.get(R.longest).path:[],'#rMini2');$('#vWords').hidden=false}

function allWords(res,a){const f=new Set(res.found),hinted=new Set(res.hinted||[]);const miss=[...a.sol.entries()].filter(([w])=>!f.has(w)).sort((x,y)=>y[0].length-x[0].length||x[0].localeCompare(y[0]));
  const mc=miss.filter(x=>x[1].lvl>=2),mr=miss.filter(x=>x[1].lvl<2);
  const chips=(arr,cls)=>arr.map(w=>`<span class="chip L${Math.min(8,w.length)} ${cls}" tabindex="0" data-w="${esc(w)}">${esc(show(res.lang,w))}<i>${hinted.has(w)?'💡':pts(w.length)}</i></span>`).join('');
  const fnd=[...f].sort((x,y)=>y.length-x.length||x.localeCompare(y));

let toastT;function toast(m,ms=2600){const t=$('#toast');t.innerHTML=`${esc(m)}<i style="animation-duration:${ms}ms"></i>`;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}

/* ---------- arrastar / tocar ---------- */
let drag=false;
function hit(e){const r=grid.getBoundingClientRect(),N=G.N,{c,gap}=geo(),x=e.clientX-r.left,y=e.clientY-r.top,cx=Math.floor(x/(c+gap)),cy=Math.floor(y/(c+gap));
  if(cx<0||cy<0||cx>=N||cy>=N)return -1;const dx=x-(cx*(c+gap)+c/2),dy=y-(cy*(c+gap)+c/2);const i=cy*N+cx;return Math.hypot(dx,dy)<c*.45&&G.g[i]?i:-1}
function addSel(i){const s=G.sel;if(i<0)return false;if(s.length>1&&s[s.length-2]===i){s.pop();beep(330,.04);return true}
  if(s.includes(i))return false;if(s.length&&!nbrs(s[s.length-1],G.N).includes(i))return false;s.push(i);beep(392+s.length*45,.06,'triangle',.05);return true}
tray.addEventListener('pointerdown',e=>{if(!G||!G.running||G.paused)return;const i=hit(e);if(i<0)return;e.preventDefault();G.typed='';
  if(S.ctl==='tap'){const s=G.sel;if(s.length&&s[s.length-1]===i){const w=cur(),p=s.slice();G.sel=[];drawTrail();submit(w,p);return}if(!addSel(i)){G.sel=[i];beep(392,.05)}drawTrail();liveWord();return}
  drag=true;G.sel=[];addSel(i);try{tray.setPointerCapture(e.pointerId)}catch(_){}drawTrail();liveWord()});
tray.addEventListener('pointermove',e=>{if(!drag)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];let ch=false;for(const ev of (evs.length?evs:[e]))ch=addSel(hit(ev))||ch;if(ch){drawTrail();liveWord()}});

/* ---------- teclado ---------- */
document.addEventListener('keydown',e=>{if(!G||!G.running||G.paused||e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.tagName==='INPUT')return;const k=e.key;
  if(k==='Enter'){const w=G.typed,p=findPath(G.g,G.N,w);G.typed='';G.sel=[];drawTrail();if(w){if(p)submit(w,p);else{feedback('bad',L.fbBoard);setWord(w.toUpperCase(),true);beep(160,.18,'sawtooth',.04)}}e.preventDefault();return}
